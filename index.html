<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Therapie Dashboard PWA</title>
<link rel="manifest" href="manifest.json">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<h2>Therapie Dashboard</h2>

<div>
Tag <input id="tag" type="number">
Leuko <input id="leuko" type="number">
Hb <input id="hb" type="number">
Thr <input id="thr" type="number">
<button onclick="addData()">Speichern</button>
<button onclick="draw()">Diagramm</button>
<button onclick="exportData()">Export</button>
<input type="file" onchange="importData(event)">
</div>

<canvas id="c" width="900" height="400"></canvas>

<script src="app.js"></script>
<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>

</body>
</html>
